name: microstash
description: "The Mental Model Gym — Retain high-leverage decision frameworks with active recall and Socratic AI challenges."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  shared_preferences: ^2.2.2
  flutter_card_swiper: ^7.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
