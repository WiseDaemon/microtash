name: Daily Book Ingestion Drop

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  daily-drop:
    name: Drop 1 New Seminal Book into Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Book Drop
        run: |
          python scripts/add_daily_book.py

      - name: Commit and Push DB Updates
        run: |
          git config user.name "Microstash Daily Curator"
          git config user.email "bot@microstash.app"
          git add data/microstash.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(daily-book): unlock new book for $(date +'%Y-%m-%d')" && git push)
