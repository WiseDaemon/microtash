name: Microstash Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Test Suite & Global Book Cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest

      - name: Run Automated Microstash Test Suite (8/8 Tests)
        run: |
          python scripts/run_test_suite.py

  flutter-verify:
    name: Flutter Android App Static Analysis & Scaffold Check
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: ./flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Verify Android Manifest & Google Play Compliance
        working-directory: ./flutter_app
        run: |
          grep -q "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml || exit 1
          grep -q "FOREGROUND_SERVICE_MEDIA_PLAYBACK" android/app/src/main/AndroidManifest.xml || exit 1
          echo "Flutter Android scaffold and Google Play compliance checks verified."
